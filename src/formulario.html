<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Rodrigo Esteves, Romeu Pinto, Tiago Mendes">
  <meta name="keywords" content="ensino, tipo, comparação, académico, profissional, página, projeto, UMAIA">
  <meta name="description" content="Ensino Profissonal vs Ensino Académico">
  <meta name="date" content="18/06/2025">
  <title>Ensino</title>
</head>

<body>
    
    <header>
      <h1>Formulário</h1>
    </header>
    <nav>
        <ul>
          <li><a href="comparacao.html">Diferenças e Semelhanças</a></li>
          <li><a href="percursos.html">Percursos e Saídas Profissionais</a></li>
          <li><a href="formulario.html">Testa os teus conhecimentos</a></li>
        </ul>
    </nav>
    
    <div><p>Working on it</p></div>
    <div>
      <form action = "#" method="post">
        <label for="nome">Nome :</label>
        <input type = "text" id="nome" name="nome" placeholder="Bruno Fernandes" title="Email profissional ou escolar" required>

        <label for="email">Email :</label>
        <input type ="email" id = "email" name="email" placeholder="bruno_fernandes@example.com" required>

        <label for="dataNascimento">Data de nascimento :</label>
        <input type="date" id="dataNascimento" name="dataNascimento" required>
        
        <label for="ensino">Tipo de ensino que frequentas ou desejas frequentar :</label>
        <input list="tipo_ensino" name="ensino" id="ensino">
        <datalist id="tipo_ensino">
          <option value="Ensino Académico">
          <option value="Ensino Profissional">
          <option value="Outro">
        </datalist>

        <label for="satisfacao">Se ja frequentas ensino academico ou profesional indica o quanto satisfeito estás (de 1 a 10) :</label>
        <input type="range" id="satisfacao" name="satisfacao" min="1" max="10" value="5">
        
        <button type="submit">Submeter</button>
      </form>
    </div>
    
    <footer>

          >Ver repositório no GitHub</a
        >
      </p>
    </footer>
</body>
</html>
