<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="ensino, tipo, comparação, académico, profissional, página, projeto, UMAIA">
  <meta name="description" content="Ensino Profissonal vs Ensino Académico">

<body>
    
    <header>
      <h1>Formulário</h1>
    </header>
    <nav>
        <ul>
          <li><a href="index.html">Home page</a></li>
          <li><a href="comparacao.html">Diferenças e Semelhanças</a></li>
          <li><a href="percursos.html">Percursos e Saídas Profissionais</a></li>
          <li><a href="formulario.html">Mini Inquérito</a></li>
        </ul>
    </nav>
    
    
    <div>
      <form id="formulario" onsubmit="submeterFormulario(event)">
        
        <label for="nome">Nome :</label>
        <input type = "text" id="nome" 
        name="nome" placeholder="Bruno Fernandes" 
        pattern="^[A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+)*$" title="O nome so pode conter letras" required>

        <label for="email">Email :</label>
        <input type ="email" id = "email" name="email" 
        placeholder="bruno_fernandes@example.com" 
        pattern="^[\\w.-]+@[\\w.-]+\\.(com|pt)$"
        title="Digite o seu mail pessoal , profissional ou escolar" required>

        <label for="dataNascimento">Data de nascimento :</label>
        <input type="date" id="dataNascimento" name="dataNascimento" required max="2025-06-18">
        
        <label>Tipo de ensino que frequentas ou desejas frequentar :</label>
        <input type="radio" id="academico" name="ensino" value="Ensino Académico" required>
        <label for="academico">Ensino Académico</label>
        <input type="radio" id="profissional" name="ensino" value="Ensino Profissional">
        <label for="profissional">Ensino Profissional</label>

        <label for="satisfacao">Se já frequentas ensino académico ou profissional indica o quanto satisfeito estás (de 1 a 10) :
          <span id="valorSatisfacao">5</span>
        </label>
        <input type="range" id="satisfacao" name="satisfacao" min="1" max="10" value="5"
        oninput="document.getElementById('valorSatisfacao').innerText = this.value">
        
        <button type="submit">Submeter</button>
      </form>
    </div>

    <section id="AnswerTable" >
      <h3>Respostas ao Inquérito</h3>
      <table  id="tabelaRespostas">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Data Nasc.</th>
          <th>Ensino</th>
          <th>Satisfação</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
      </table>
    </section>
